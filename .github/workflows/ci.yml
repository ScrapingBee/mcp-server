name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e . pytest==8.3.5
      - name: Unit tests
        run: pytest -q tests
      - name: Validate manifests
        run: |
          curl -fsSL -o /tmp/server.schema.json https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
          curl -fsSL -o /tmp/glama.schema.json https://glama.ai/mcp/schemas/server.json
          uvx check-jsonschema@0.33.0 --schemafile /tmp/server.schema.json server.json
          uvx check-jsonschema@0.33.0 --schemafile /tmp/glama.schema.json glama.json
      - name: Introspect the hosted server through the launcher (no API key, no credits)
        run: python tests/smoke_stdio.py
