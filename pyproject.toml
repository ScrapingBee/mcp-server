[project]
name = "scrapingbee-mcp"
version = "1.0.0"
description = "Local stdio launcher for the hosted ScrapingBee MCP server (https://mcp.scrapingbee.com/mcp)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ScrapingBee", email = "contact@scrapingbee.com" }]
keywords = ["mcp", "model-context-protocol", "scrapingbee", "web-scraping", "serp", "ai-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["fastmcp==3.2.4"]

[project.urls]
Homepage = "https://www.scrapingbee.com/documentation/remote-mcp/"
Documentation = "https://www.scrapingbee.com/documentation/remote-mcp/"
Repository = "https://github.com/ScrapingBee/mcp-server"
Issues = "https://github.com/ScrapingBee/mcp-server/issues"

[project.scripts]
scrapingbee-mcp = "scrapingbee_mcp.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapingbee_mcp"]
